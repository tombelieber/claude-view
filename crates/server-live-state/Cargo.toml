[package]
name = "claude-view-server-live-state"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
codegen = ["claude-view-core/codegen", "claude-view-db/codegen", "claude-view-server-teams/codegen"]

[dependencies]
claude-view-core = { workspace = true }
claude-view-db = { workspace = true }
claude-view-server-teams = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
tokio-util = { workspace = true }
claude-view-types = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
